program: src/tome/training.py
method: grid
metric:
  name: validation/accuracy
  goal: maximize
parameters:
  model.merge_during_training:
    values: [true, false]
  seed:
    values: [0, 1, 2]
command:
  - ${env}
  - ${interpreter}
  - -m
  - src.tome.training
  - --config
  - src/tome/config.yaml
  - ${args_no_hyphens}
