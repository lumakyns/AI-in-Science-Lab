project: lifetime_ghost
name: lifetime_ghost-cifar100
program: src/lifetime_ghost/training.py
method: grid
metric:
  name: validation/accuracy
  goal: maximize
parameters:
  model.family:
    values:
    - nat
    - vil
  model.routing.policy:
    values:
    - lifetime
  model.routing.keep_ratio:
    value: 0.25
  training.prediction_weight:
    value: 0.1
  seed:
    value: 0
command:
- ${env}
- ${interpreter}
- -m
- src.lifetime_ghost.training
- --config
- src/lifetime_ghost/config.yaml
- ${args_no_hyphens}
