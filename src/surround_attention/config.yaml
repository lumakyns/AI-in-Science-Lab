dataset: cifar100
data_root: data
seed: 0
device: cuda
augmentation: true
model:
  family: nat
  dims: [64, 128, 256]
  depths: [2, 2, 4]
  heads: [2, 4, 8]
  window: 3
  global_tokens: 1
  mlp_ratio: 4.0
  drop_path: 0.1
  modulation:
    variant: baseline
    stage: 1
    block: 0
    fraction: 0.5
    kernel_size: 5
    sigma_e: 1.2
    sigma_i: 1.4
    random_seed: 0
optimizer:
  learning_rate: 0.0005
  weight_decay: 0.05
  betas: [0.9, 0.999]
scheduler:
  warmup_epochs: 3
  min_lr_ratio: 0.01
training:
  epochs: 30
  gradient_clip_norm: 1.0
  label_smoothing: 0.1
  amp: true
  cpu_threads: 4
  log_every_batches: 50
  max_batches: null
dataloader:
  batch_size: 128
  eval_batch_size: 128
  num_workers: 4
  pin_memory: true
checkpoint:
  dir: checkpoints/surround_attention
  save_last: true
wandb:
  project: surround_attention
  mode: online
  entity: null
  tags: [surround-modulation, cifar100, nat, vision-longformer]
