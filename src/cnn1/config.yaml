dataset: cifar10
data_root: data
seed: 0
device: cuda
augmentation: true
model:
  channels: [32, 64, 128]
optimizer:
  learning_rate: 0.001
  weight_decay: 0.0001
scheduler:
  min_lr_ratio: 0.01
training:
  epochs: 10
  gradient_clip_norm: 10.0
  cpu_threads: 4
  log_every_batches: 50
  max_batches: null
dataloader:
  batch_size: 128
  eval_batch_size: 256
  num_workers: 4
  pin_memory: true
checkpoint:
  dir: checkpoints/cnn1
  save_last: true
statistics:
  color_limit: 0.002
wandb:
  project: cnn1
  mode: online
  entity: null
  tags: [cnn1, weight-patterns]
