project: cnn1
name: cifar10-cifar100-10-epochs
program: src/cnn1/training.py
method: grid
metric:
  name: test/accuracy
  goal: maximize
parameters:
  dataset:
    values: [cifar10, cifar100]
  seed:
    value: 0
  training.epochs:
    value: 10
command:
  - ${env}
  - ${interpreter}
  - -m
  - src.cnn1.training
  - --config
  - src/cnn1/config.yaml
  - ${args_no_hyphens}
