project: predictive_ghost
name: predictive_ghost-cifar100
program: src/predictive_ghost/training.py
method: grid
metric:
  name: validation/accuracy
  goal: maximize
parameters:
  model.family:
    values:
    - nat
    - vil
  model.routing.policy:
    values:
    - dense
    - random
    - predictive
  model.routing.keep_ratio:
    value: 0.25
  training.prediction_weight:
    value: 0.1
  seed:
    value: 0
command:
- ${env}
- ${interpreter}
- -m
- src.predictive_ghost.training
- --config
- src/predictive_ghost/config.yaml
- ${args_no_hyphens}
