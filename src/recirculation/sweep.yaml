program: src/recirculation/training.py
command:
  - ${env}
  - ${interpreter}
  - -m
  - src.recirculation.training
  - --config
  - src/recirculation/config.yaml
method: grid
metric:
  name: validation/mse
  goal: minimize
parameters:
  learning.algorithm:
    values: [recirculation]
  model.tied_weights:
    values: [true]
  optimizer.learning_rate:
    values: [0.0001, 0.00005, 0.00001, 0.000005]
  seed:
    values: [0, 1, 2]
